name: Deploy site to GitHub Pages

# Replaces the classic "build from branch" Pages build. The only thing this
# adds over serving the repo verbatim is stamping the last-modified dates from
# git history at deploy time, so they can never drift the way a hand-maintained
# literal does. Nothing is committed back: the stamp exists only in the
# deployed copy, so the commit history stays free of bot noise.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never publish two deploys at once. An in-progress run is allowed to finish
# rather than being cancelled part-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The dates come from `git log`, so full history is required; the
          # default shallow checkout would report the wrong commit.
          fetch-depth: 0

      - name: Stamp last-modified dates from git history
        run: python3 .github/scripts/stamp_dates.py

      - name: Assemble the publish directory
        run: |
          set -euo pipefail
          # Copy explicitly rather than publishing the checkout as-is, so .git
          # and the workflow itself are never served. reference/ is gitignored
          # and so should never reach a checkout, but it is a local clone of
          # someone else's site and was committed here by accident once before
          # (it is what broke the Pages build), so exclude it outright rather
          # than trusting .gitignore to hold.
          # local/ holds working notes and *.zip the source archives a post is
          # prepared from. Everything under blog/ is published verbatim, so
          # either one left in the tree would be served to the public.
          # .gitignore already keeps them out of the checkout; excluding them
          # here too is the same belt-and-braces as reference/.
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='reference' \
            --exclude='README.md' \
            --exclude='local' \
            --exclude='*.zip' \
            ./ _site/
          # The verification file is the one dotfile-adjacent thing that must
          # survive: Search Console fails the moment it 404s.
          test -f _site/google93b692f99fc0a434.html \
            || { echo "::error::Google verification file missing from the publish directory"; exit 1; }
          # The discovery files are each linked from somewhere that would 404
          # without them: feed.xml from the blog's <link rel="alternate">,
          # llms.txt from robots.txt and the blog page, and index.md from the
          # post's own <link rel="alternate">. Silent absence is the failure
          # mode worth catching, because nothing on the page looks broken.
          # The IndexNow key file is in this list because the protocol verifies
          # host control by fetching it. If it 404s, every submission is
          # rejected, and the only symptom is search engines quietly not being
          # told about new posts.
          for f in llms.txt robots.txt sitemap.xml blog/feed.xml \
                   ff93bf625b094e4f9ba2f616af28cebe.txt \
                   blog/agentic-coding-in-the-wild/index.md \
                   blog/agentic-coding-in-the-wild/llms.txt \
                   blog/agentic-coding-in-the-wild/opengraph-image.png; do
            test -f "_site/$f" \
              || { echo "::error::$f missing from the publish directory"; exit 1; }
          done
          echo "Publishing:"
          find _site -type f | sort | sed 's/^/  /'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs only once the new copy is actually live: telling a search engine a URL
  # changed while the old copy is still being served just buys a crawl of the
  # old copy. Reaches Bing, Yandex, Seznam, Naver and Yep through one request.
  # Google does not participate in IndexNow, so it still learns about changes
  # from sitemap.xml alone.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The script submits only what changed in this push, which means
          # diffing against the previous head; a shallow checkout would not
          # have it.
          fetch-depth: 0

      - name: Tell the IndexNow engines what changed
        env:
          # Empty on workflow_dispatch, and all zeroes on a branch's first
          # push. The script treats either as "no usable base" and submits
          # every listed URL rather than nothing.
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 .github/scripts/indexnow.py
